# Converter configuration: the single-sex SS3 bridge model B2e of the 2022 ISC
# North Pacific blue shark assessment (base case S6) -> opal.
#
# B2e is built from S6 by case-studies/npo-bsh/scripts/01-build-ss3-bridge.r:
# single sex (Nsexes = -1), F18 double normal, F8 split at its selectivity
# blocks (new fleet 32), no F19 selectivity deviations, no initial regime
# offset and no F-ballpark penalty.
#
# Everything here is a decision that CANNOT be read out of the SS3 files.

model:        npo-bsh-b2e
ss3_dir:      case-studies/npo-bsh/model-files/ss3/02e-no-f-ballpark
ss3_version:  "3.30"
out_dir:      opal_data/npo-bsh
prefix:       npobsh

metadata:
  species:     Blue shark
  region:      North Pacific Ocean
  data_type:   assessment
  note:        Single-sex bridge (B2e) of the 2022 ISC SHARKWG base case S6
  reference:   "ISC (2022) Stock assessment of blue shark in the North Pacific Ocean through 2020. ISC/22/ANNEX/12"

files:
  dat:         data_echo.ss_new
  ctl:         control.ss_new
  par:         ss3.par
  read_report: true

# --- Time --------------------------------------------------------------------
# Annual model, 1971-2020, one season: opal n_year = 50, n_season = 1.
time:
  first_ts: 1971
  last_ts:  2020

# --- Ages --------------------------------------------------------------------
# SS3 ages 0-24, all kept: opal's first age class is SS3's age-0 recruitment
# (both recruit at the start of the year from that year's spawning biomass).
age:
  keep_ss3_ages: [0, 24]
  min_age:       0

# --- Recruitment ---------------------------------------------------------------
# Carry SS3's early deviations (1961-1970) into opal's initial age structure.
recdev:
  initial: true

# --- Growth ------------------------------------------------------------------
# SS3 Richards growth with shape 1 (= von Bertalanffy), L1 at age 1 and L2 at
# age 20, linear below age 1. opal's Schnute curve is fitted to SS3's
# length-at-age (it only feeds the PLA for selectivity on the endgrowth route).
growth:
  A1:      1
  A2:      20
  fit_cv:  true
  model:   schnute

# --- Biology -----------------------------------------------------------------
# Age-basis biology from SS3's endgrowth table. Spawning output is pups:
# Mat*Fecund x FracFemale (0.5, Nsexes = -1).
bio:
  source: endgrowth
  endgrowth:
    length_basis:       Beg
    weight:             true
    maturity:           true
    spawning_potential: true
    m:                  true
  m_rate_divisor: null

# --- Indices -----------------------------------------------------------------
# Only S5 (JPN early, 1976-1993) and S6 (JPN late, 1994-2020) have lambda 1 in
# SS3; the other nine indices have lambda 0 and are left out. Both mirror F4's
# selectivity in SS3; in opal each index is its own fishery carrying SS3's
# selectivity-at-age for that index fleet. SS3 adds the control file's
# add_to_survey_CV (0.188 for S5, 0 for S6) to the input SE; that is done here
# and opal's tau is fixed at 0. SS3 observes the indices in month 7; opal
# predicts them from start-of-year numbers.
index:
  keep_ss3_fleets: [25, 26]
  normalise:    none
  month_labels: [7, 7]
  keep_negative_fleets: false
  add_survey_var_adjust: true

# --- Length compositions -----------------------------------------------------
# Fleets with length data, all lambda 1. SS3 fleet 32 (F8 from 1982) is opal
# fishery 21 (the extraction fleets are renumbered 1-21 in SS3 order).
# SS3's 5 cm bins from 5 to 300 cm are already on a regular grid.
lf:
  keep_negative_fleets: false
  regularise_last_bin:  false
  keep_fisheries:       [1, 3, 4, 5, 7, 8, 9, 14, 15, 17, 18, 19, 20, 21]
  cap:                  null
  addtocomp:            1.0e-4

# --- Selectivity -------------------------------------------------------------
# All SS3 fleets use size-based selectivity: double normal (24) or a mirror (5)
# of another fleet. opal fisheries: 1-20 = SS3 F1-F20, 21 = SS3 fleet 32 (F8
# from 1982), 22-23 = indices S5 and S6 (both mirror F4 in SS3).
selectivity:
  report_factor:  Asel2
  reference_year: 2020
  n_par:          6
  opal_type_f:
    [2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2,
     2,
     2, 2]
  # SS3 mirrors (pattern 5), as opal fishery: source
  mirror:
    "2":  1
    "6":  4
    "10": 9
    "12": 1
    "13": 3
    "16": 15
    "22": 4
    "23": 4
  # F11 has no length compositions (its one SS3 size-frequency observation
  # is not carried), so its curve stays at SS3's
  estimate: [1, 3, 4, 5, 7, 8, 9, 14, 15, 17, 18, 19, 20, 21]
  free_par:
    "2": [1, 3, 4]

sizefreq:
  include: false
  method:  1
