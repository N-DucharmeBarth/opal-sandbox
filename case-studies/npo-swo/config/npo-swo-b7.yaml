# Converter configuration: the single-sex, annual SS3 bridge model B7 of the
# 2023 ISC North Pacific swordfish base case -> opal.
#
# B7 is built from the base case by case-studies/npo-swo/scripts/01-build-ss3-bridge.r:
# single sex (Nsexes = -1), selectivity blocks replaced by fleets, spawning,
# settlement and index observations in month 1, one season, one length
# composition per fleet and year.
#
# Everything here is a decision that CANNOT be read out of the SS3 files.

model:        npo-swo-b7
ss3_dir:      case-studies/npo-swo/model-files/ss3/07-index-month-1
ss3_version:  "3.30"
out_dir:      opal_data/npo-swo
prefix:       nposwo

metadata:
  species:     Swordfish
  region:      North Pacific Ocean
  data_type:   assessment
  note:        Single-sex, annual bridge (B7) of the 2023 ISC BILLWG base case
  reference:   "ISC (2023) Stock assessment report for swordfish (Xiphias gladius) in the North Pacific through 2021. ISC/23/ANNEX/11"

files:
  dat:         data_echo.ss_new
  ctl:         control.ss_new
  par:         ss3.par
  read_report: true

# --- Time --------------------------------------------------------------------
# Annual model, 1975-2021, one season: opal n_year = 47, n_season = 1.
time:
  first_ts: 1975
  last_ts:  2021

# --- Ages --------------------------------------------------------------------
# SS3 ages 0-15, all kept. Recruits settle at the start of the year in B7, so
# opal's first age class is SS3's age-0 recruitment of that year.
age:
  keep_ss3_ages: [0, 15]
  min_age:       0

# --- Recruitment ---------------------------------------------------------------
# Carry SS3's early deviations (1965-1974) into opal's initial age structure.
recdev:
  initial: true

# --- Growth ------------------------------------------------------------------
# SS3 von Bertalanffy with L1 at age 0.5 and L2 at age 15. opal's reference
# ages are whole ages, so its Schnute curve is fitted to SS3's length-at-age
# with A1 = 1 and A2 = 15 (it only feeds the PLA for length-based selectivity
# and the predicted compositions on the endgrowth route).
growth:
  A1:      1
  A2:      15
  fit_cv:  true
  model:   schnute

# --- Biology -----------------------------------------------------------------
# Age-basis biology from SS3's endgrowth table. Spawning output is female
# mature biomass: Mat*Fecund (fecundity = weight) x FracFemale (0.5,
# Nsexes = -1).
bio:
  source: endgrowth
  endgrowth:
    length_basis:       Beg
    weight:             true
    maturity:           true
    spawning_potential: true
    m:                  true
  m_rate_divisor: null

# --- Indices -----------------------------------------------------------------
# The indices with lambda 1 in SS3: S1-S4 (Japanese longline, early and late
# periods, two areas), S6 (US deep-set longline, a recruitment index: SS3
# units 33), S7 (US shallow-set longline 1995-2000) and S2 1994-97 (fleet 30,
# split from S2 at F1's selectivity block). S5 and S8 have lambda 0 and are
# left out. SS3 adds no extra SD to these; it floats q.
index:
  keep_ss3_fleets: [20, 21, 22, 23, 25, 26, 30]
  normalise:    none
  month_labels: [1, 1, 1, 1, 1, 1, 1]
  keep_negative_fleets: false
  add_survey_var_adjust: true

# --- Length compositions -----------------------------------------------------
# Fleets with length data and lambda 0.5 in SS3 (the lambda is applied as an
# opal lf lambda in the fitting script). F9's observations are all excluded
# in SS3 (negative year) and F5 has none. opal fisheries 20 and 22 are SS3
# fleets 28 (F1 1994-97) and 31 (F2 2004-09). SS3's 5 cm bins from 10 to
# 260 cm are already on a regular grid.
lf:
  keep_negative_fleets: false
  regularise_last_bin:  false
  keep_fisheries:       [1, 2, 3, 4, 6, 7, 8, 20, 22]
  cap:                  null
  addtocomp:            1.0e-3

# --- Selectivity -------------------------------------------------------------
# opal fisheries 1-19 = SS3 F1-F19; 20 = F1 1994-97 (SS3 28), 21 = F12
# 1994-97 (29), 22 = F2 2004-09 (31), 23-25 = F15, F16, F19 2004-09 (32-34);
# indices 26-32 = S1, S2, S3, S4, S6, S7, S2 1994-97.
# SS3: double normal (24) for F1, F3, F6, F7, F8 and F1 1994-97; logistic (1)
# for F2, F4 and F2 2004-09; every other fleet mirrors one of them (15).
# S6 (SS3 size pattern 0, recruitment index) is handled in the fitting
# script: selectivity 1 at age 0 and 0 at older ages.
selectivity:
  report_factor:  Asel2
  reference_year: 2021
  n_par:          6
  opal_type_f:
    [2, 1, 2, 1, 1, 2, 2, 2, 2, 2, 2, 2, 1, 2, 1, 1, 2, 2, 1,
     2, 2, 1, 1, 1, 1,
     2, 2, 2, 2, 2, 2, 2]
  # SS3 mirrors (pattern 15), as opal fishery: source
  mirror:
    "5":  4
    "9":  8
    "10": 6
    "11": 6
    "12": 1
    "13": 2
    "14": 1
    "15": 2
    "16": 2
    "17": 3
    "18": 3
    "19": 2
    "21": 20
    "23": 22
    "24": 22
    "25": 22
    "26": 6
    "27": 1
    "28": 3
    "29": 3
    "31": 8
    "32": 20
  estimate: [1, 2, 3, 4, 6, 7, 8, 20, 22]

sizefreq:
  include: false
  method:  1
